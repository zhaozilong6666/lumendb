name: Apply LumenDB Patch

on:
  push:
    paths:
      - '.github/workflows/apply-lumendb-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and push
        run: |
          git config user.name "LumenDB CI"
          git config user.email "ci@lumendb.local"
          curl -fsSL "https://aka.doubaocdn.com/s/MX78cluZpK" -o /tmp/lumendb.patch
          git am /tmp/lumendb.patch
          git push origin HEAD:main
