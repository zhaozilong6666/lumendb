name: Apply LumenDB patch
on:
  push:
    paths:
      - ".lumendb/notvalid.patch.gz.b64"
      - ".github/workflows/apply-lumendb-patch.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair payload typo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.lumendb/notvalid.patch.gz.b64')
          s = p.read_text().strip()
          s = s[:-1]
          s = s[:156] + 'X' + s[157:]
          p.write_text(s, encoding='utf-8')
          PY
          base64 -d .lumendb/notvalid.patch.gz.b64 | gzip -t
      - name: Decode patch
        run: base64 -d .lumendb/notvalid.patch.gz.b64 | gunzip > /tmp/apply.patch
      - name: Apply patch
        run: git apply --whitespace=nowarn /tmp/apply.patch
      - name: Commit and push
        run: |
          git config user.name "赵梓聪"
          git config user.email "3487781376@qq.com"
          git add README.md docs lumendb tests
          git commit -m "feat(sql): NOT VALID foreign keys and VALIDATE CONSTRAINT"
          git push origin HEAD:main
