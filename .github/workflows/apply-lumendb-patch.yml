name: Apply LumenDB patch
on:
  push:
    paths:
      - ".lumendb/truncate-multi.patch.gz.b64"
      - ".github/workflows/apply-lumendb-patch.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decode patch
        run: base64 -d .lumendb/truncate-multi.patch.gz.b64 | gunzip > /tmp/apply.patch
      - name: Apply patch
        run: git apply --whitespace=nowarn /tmp/apply.patch
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Test and static checks
        run: |
          python -m pytest tests -q
          python -m compileall -q lumendb tests
          git diff --check
      - name: Commit and push
        run: |
          git config user.name "赵梓聪"
          git config user.email "3487781376@qq.com"
          git add README.md docs lumendb tests
          git commit -m "feat(sql): TRUNCATE multiple tables with dependency check"
          git push origin HEAD:main
