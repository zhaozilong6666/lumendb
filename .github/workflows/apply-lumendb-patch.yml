name: Apply LumenDB Patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          curl -fsSL -o /tmp/lumendb.patch https://aka.doubaocdn.com/s/2iXz2jOgBz
          git config user.name "赵梓聪"
          git config user.email "3487781376@qq.com"
          git am /tmp/lumendb.patch
          git push origin main
