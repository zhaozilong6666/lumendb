name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 的默认控制台编码是 cp1252；context_pack 等工具会打印
      # 中文摘要，必须强制 UTF-8，否则测试全绿后仍会在 Check context pack 挂掉。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run unit and crash tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q 2>&1 | tee pytest.log

      - name: Publish pytest failure tail
        if: failure()
        shell: bash
        run: |
          {
            echo "### Pytest failure tail"
            echo '```'
            tail -n 200 pytest.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check context pack
        run: python -m tools.context_pack check

      - name: Smoke test the CLI
        run: |
          python -m lumendb exec --path ./ci_data "CREATE TABLE t (a INT)"
          python -m lumendb exec --path ./ci_data "INSERT INTO t VALUES (1), (2)"
          python -m lumendb exec --path ./ci_data "SELECT COUNT(*) FROM t"
          python -m lumendb exec --path ./ci_data "SELECT * FROM t ORDER BY a"

  concurrent:
    # 并发模式全量放到独立 job：原先挂在 Ubuntu 3.12 的默认 job 后面串行跑，
    # 同一台 runner 要连跑两遍 1471 例，墙钟时间翻倍、看起来像卡住。独立 job
    # 与四矩阵默认任务并行，反馈更快；不变量用例本身已在 pytest 内双模式参数化。
    name: Concurrent DML on ubuntu-latest
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      LUMEN_CONCURRENT_DML: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run tests (concurrent DML mode)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q 2>&1 | tee pytest.log

      - name: Publish pytest failure tail
        if: failure()
        shell: bash
        run: |
          {
            echo "### Pytest failure tail"
            echo '```'
            tail -n 200 pytest.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
